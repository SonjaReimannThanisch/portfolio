<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./styles/why_me.css">
    <link rel="stylesheet" href="./styles/my_skills.css">
    <link rel="stylesheet" href="./styles/my_work.css">
    <link rel="stylesheet" href="./styles/references.css">
    <link rel="stylesheet" href="./styles/contacts.css">
    <link rel="stylesheet" href="./styles/responsive.css">
    <script src="./script.js"></script>
    <title>Sonja Reimann-Thanisch</title>
</head>
<body>
    <main id="portfolio">
        <section id="hero" class="hero-section">
            <aside class="hero-sidebar">
                <div class="logo">
                    <svg viewBox="0 0 130 110" class="logo-svg" aria-label="Frontend Developer SR Logo">
                        <defs>
                            <path id="logo-arc" d="M 20 70 A 45 45 0 0 1 110 70" />
                        </defs>

                        <text class="logo-arc-text">
                            <textPath href="#logo-arc" startOffset="50%" text-anchor="middle">
                                frontend developer
                            </textPath>
                        </text>

                        <text class="logo-initials" x="60" y="70" text-anchor="middle">
                            SR
                        </text>
                    </svg>
                </div>
                <nav id="main-nav">
                    <ul>
                        <li class="nav-item" data-section="projects">Why me</li>
                        <li class="nav-item" data-section="skills">Skills</li>
                        <li class="nav-item" data-section="about">My Work</li>
                        <li class="nav-item" data-section="contact">Contact</li>
                    </ul>
                </nav>
            </aside>
            <div class="hero-content">
                <div id="social-links" class="social-links">
                    <nav>
                        <ul>
                            <li><img src="./assets/icons/Vector (1).png" alt="Email"></li>
                            <li><img src="./assets/icons/Vector.png" alt="LinedIn"></li>
                            <li><img src="./assets/icons/Vector (2).png" alt="GitHub"></li>
                            <li id="languageLink" class="language-link">DE | EN</li>
                        </ul>
                    </nav>
                </div>
                <img
                    class="hero-image"
                    src="./assets/img/Q46-Z25-SAM-1_1721735680737-removebg-preview.png"
                    alt="Portrait of Sonja Reimann-Thanisch"
                >
                <div class="hero-naming">
                    <div class="name">
                        <h1> Sonja Reimann-Thanisch</h1>
                    </div>
                    <div class="designation">
                        <h2>Frontend Developer</h2>
                    </div>
                </div>
                <a class="next-section-link" href="#about"><img src="./assets/icons/Property 1=Default.png" alt="Next Page"></a>
            </div>
        </section>
        <section id="about" class="why-me-section"></section>
        <section id="skills"></section>
        <section id="projects"></section>
        <section id="references"></section>
        <section id="contact">

        </section>
        <footer id="footer"></footer>
    </main>
    <script src="./scripts/data.js"></script>
    <script src="./scripts/render.js"></script>
</body>
</html>
